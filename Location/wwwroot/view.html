<!DOCTYPE html>
<html>
<head>
  <title>Live Route Viewer</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <style>
    #map { height: 100vh; }
  </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>

let map = L.map('map').setView([10, 76], 15);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png')
  .addTo(map);

let marker = L.marker([10, 76]).addTo(map);
let routeLine = L.polyline([], { }).addTo(map);

async function updateRoute() {

    let res = await fetch("/path");
    let data = await res.json();

    if (data.length > 0) {

        let points = data.map(p => [p.lat, p.lng]);

        routeLine.setLatLngs(points);
        marker.setLatLng(points[points.length - 1]);

        map.fitBounds(routeLine.getBounds(), { padding: [20,20] });
    }
}

setInterval(updateRoute, 2000); // update every 2 sec

</script>
</body>
</html>
